<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>أداة عكس فلاتر إنستغرام</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #1a1a1a; 
            color: #fff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px;
            box-sizing: border-box;
        }
        .container { 
            background: #2d2d2d; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); 
            width: 100%; 
            max-width: 400px; 
            text-align: center; 
        }
        h2 { margin-bottom: 20px; color: #d63384; font-size: 1.5rem; }
        label { display: block; text-align: right; margin-bottom: 8px; font-weight: bold; }
        select, input, button { 
            width: 100%; 
            padding: 14px; 
            margin-bottom: 20px; 
            border-radius: 8px; 
            border: 1px solid #444; 
            background: #1a1a1a; 
            color: white; 
            box-sizing: border-box;
            font-size: 1rem;
        }
        input[type="file"] { padding: 10px; background: #222; }
        button { 
            background-color: #0d6efd; 
            border: none; 
            font-size: 1.1rem; 
            font-weight: bold; 
            cursor: pointer; 
            transition: background 0.3s; 
        }
        button:hover { background-color: #0b5ed7; }
        #status { margin-top: 10px; font-size: 1rem; color: #ffc107; min-height: 24px;}
    </style>
</head>
<body>

    <div class="container">
        <h2>فك فلاتر الصوت 🎙️</h2>
        <form id="uploadForm">
            <label for="file">اختر ملف الصوت أو الفيديو:</label>
            <input type="file" id="file" name="file" accept="audio/*,video/*,.m4a,.mp4,.mov,.aac" required>
            
            <label for="effect">اختر الفلتر المراد فكه:</label>
            <select id="effect" name="effect">
                <option value="Princess">Princess 🎀 (الأميرة)</option>
                <option value="Chipmunk">Chipmunk 🐿️ (السنجاب)</option>
                <option value="Demon">Demon 😈 (الشيطان)</option>
                <option value="Grandpa">Grandpa 🎵 (الجد)</option>
                <option value="Grandma">Grandma 🎵 (الجدة)</option>
                <option value="Other">فلاتر أخرى</option>
            </select>
            
            <button type="submit">استخراج وفك الفلتر</button>
        </form>
        <p id="status"></p>
    </div>

    <script>
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const statusText = document.getElementById('status');
            const submitBtn = document.querySelector('button[type="submit"]');
            
            statusText.style.color = '#ffc107';
            statusText.innerText = "جاري استخراج الصوت والمعالجة... ⏳";
            submitBtn.disabled = true;
            submitBtn.style.opacity = '0.7';
            
            const formData = new FormData(e.target);
            
            try {
                const response = await fetch('/process', {
                    method: 'POST',
                    body: formData
                });
                
                if (response.ok) {
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'reversed_audio.wav';
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    statusText.style.color = '#28a745';
                    statusText.innerText = "✅ تمت المعالجة والتحميل بنجاح!";
                } else {
                    const errorData = await response.json();
                    statusText.style.color = '#dc3545';
                    statusText.innerText = "❌ خطأ: " + (errorData.error || "فشلت العملية");
                }
            } catch (error) {
                statusText.style.color = '#dc3545';
                statusText.innerText = "❌ حدث خطأ في الاتصال.";
            } finally {
                submitBtn.disabled = false;
                submitBtn.style.opacity = '1';
            }
        });
    </script>
</body>
</html>
